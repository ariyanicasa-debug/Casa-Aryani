<svg width="220" height="220" viewBox="0 0 220 220" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <circle cx="110" cy="110" r="110" fill="#14382D"/>

  <!-- Entire logo composition centered as one group -->
  <g transform="translate(0 -8)">

    <!-- Logo Mark -->
    <path
      d="M58 127L110 53L162 127"
      stroke="#D8B16A"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <path
      d="M82 127H138"
      stroke="#D8B16A"
      stroke-width="8"
      stroke-linecap="round"
    />

    <path
      d="M94 146C102 139 118 139 126 146"
      stroke="#D8B16A"
      stroke-width="5.5"
      stroke-linecap="round"
    />

    <!-- Brand Name -->
    <text
      x="110"
      y="178"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14"
      fill="#F8F1E6"
      letter-spacing="1.8"
      textLength="150"
      lengthAdjust="spacingAndGlyphs"
    >CASA ARIYANI</text>

  </g>

</svg>
